  <!-- Masthead bar -->
  <path d="M 7 8 L 17 8" stroke="#DC2626" stroke-width="2" stroke-linecap="round" />
  <!-- Text rhythm lines -->
  <path d="M 7 12 L 13 12" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 7 15.5 L 11 15.5" stroke="#DC2626" stroke-width="1.8" stroke-linecap="round" />
  <!-- Editorial stamp / wire photo block -->
